{% extends "base.html" %}
{% block content %}
<div>
  {{ macros.m_tab_head_start() }}
    {{ macros.m_tab_head('list', '파일 목록', true) }}
  {{ macros.m_tab_head_end() }}

  {{ macros.m_tab_content_start() }}
  <div class="tab-pane active" id="list">
    <table id="result_table" class="table table-bordered table-striped table-hover table-sm">
      <thead class="thead-dark">
        <tr>
          <th style="width: 8%; text-align: center;">No</th>
          <th style="width: 70%;">파일명 (경로)</th>
          <th style="width: 22%; text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody id="list_tbody">
        <tr><td colspan="3" class="text-center text-muted p-4">목록을 불러오는 중입니다...</td></tr>
      </tbody>
    </table>
  </div>
  {{ macros.m_tab_content_end() }}
</div>

<script type="text/javascript">
$(document).ready(function(){
    // 변수 참조 에러를 막기 위해 플러그인 주소를 완벽하게 하드코딩했습니다.
    $.ajax({
        url: '/ff_local_m3u/ajax/main/get_list',
        type: "POST",
        cache: false,
        success: function (data) {
            if (data.ret == 'success' && data.list.length > 0) {
                make_list(data.list);
            } else {
                $('#list_tbody').html('<tr><td colspan="3" class="text-center text-muted p-4">등록된 파일이 없거나 경로가 잘못되었습니다. 설정 탭에서 경로를 확인하세요.</td></tr>');
            }
        },
        error: function() {
            $('#list_tbody').html('<tr><td colspan="3" class="text-center text-danger p-4">서버와 통신 중 에러가 발생했습니다.</td></tr>');
        }
    });
});

function make_list(data) {
    var html = '';
    for (var i = 0; i < data.length; i++) {
        var item = data[i];
        html += '<tr>';
        html += '<td style="text-align: center; vertical-align: middle;">' + item.idx + '</td>';
        
        html += '<td style="vertical-align: middle; word-break: break-all;">';
        html += '  <span class="font-weight-bold">' + item.name + '</span>';
        html += '</td>';
        
        html += '<td style="text-align: center; vertical-align: middle;">';
        html += '  <div class="btn-group btn-group-sm" role="group">';
        html += '    <a href="' + item.url + '" target="_blank" class="btn btn-info btn-sm">웹재생</a>';
        html += '    <button class="btn btn-success btn-sm btn-clipboard" data-clipboard-text="' + item.url + '">주소 복사</button>';
        html += '  </div>';
        html += '</td>';
        html += '</tr>';
    }
    $('#list_tbody').html(html);
}

$("body").on('click', '.btn-clipboard', function(e){
    e.preventDefault();
    var text = $(this).attr('data-clipboard-text');
    var t = document.createElement("textarea");
    document.body.appendChild(t);
    t.value = text;
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    notify('스트리밍 주소가 클립보드에 복사되었습니다.', 'success');
});
</script>
{% endblock %}
